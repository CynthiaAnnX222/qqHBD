<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飞朱环游记</title>

  <!-- =====================================================
    📦 外部依赖库
  ===================================================== -->
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Noto+Serif+SC:wght@300;400&family=Rajdhani:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --emerald:     #2cc7a5;      /* 蓝绿色主题线 */
      --sky-glow:    rgba(56, 189, 248, 0.45); 
      --ink:         #020617;      
      --card-bg:     rgba(15, 23, 42, 0.7); 
      --card-border: rgba(255, 255, 255, 0.15); 
      --text-bright: #f8fafc;      
      --text-muted:  #94a3b8; 
      --transition-card: 0.6s cubic-bezier(0.16, 1, 0.3, 1); 
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden; background: var(--ink);
      font-family: 'Noto Serif SC', serif; color: var(--text-bright);
    }

    #map { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }

    /* 顶部标题加控制按钮区域 */
    #header-container {
      position: fixed; top: 30px; left: 30px; z-index: 50;
      display: flex; flex-direction: column; gap: 15px;
    }

    /* 顶部标题面板 */
    .header-panel {
      background: var(--card-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      padding: 18px 30px; border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
    }
    .header-panel .main-title {
      font-family: 'Cormorant Garamond', serif; font-size: 24px; font-weight: 400; letter-spacing: 0.15em;
      color: #ffffff; text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }
    .header-panel .subtitle {
      display: block; margin-top: 6px;
      font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 400; letter-spacing: 0.3em;
      color: #cbd5e1; text-transform: uppercase;
    }

    /* 🟢 新增功能：回到全景初始界面的精致发光按钮 */
    .reset-view-btn {
      align-self: flex-start;
      background: var(--card-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      color: #ffffff; padding: 12px 22px; border-radius: 30px;
      font-family: 'Rajdhani', sans-serif; font-size: 12px; font-weight: 500;
      letter-spacing: 2px; cursor: pointer;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reset-view-btn i { color: var(--emerald); font-size: 14px; transition: transform 0.6s ease; }
    .reset-view-btn:hover {
      border-color: var(--emerald);
      color: var(--emerald);
      box-shadow: 0 10px 25px rgba(44, 199, 165, 0.25);
      transform: translateY(-2px);
    }
    .reset-view-btn:hover i {
      transform: rotate(180deg); /* 悬浮时小地球标志会酷炫旋转 */
    }

    /* 故事卡片 UI */
    #story-card {
      position: fixed; right: 40px; top: 50%;
      transform: translateY(-50%) translateX(0px);
      z-index: 20; width: 380px;
      background: var(--card-bg);
      backdrop-filter: blur(30px) saturate(150%);
      -webkit-backdrop-filter: blur(30px) saturate(150%);
      border: 1px solid var(--card-border); border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5); overflow: hidden;
      opacity: 0; transform: translateY(-50%) translateX(40px);
      transition: opacity var(--transition-card), transform var(--transition-card);
      pointer-events: none;
    }
    #story-card.active { opacity: 1; transform: translateY(-50%) translateX(0px); pointer-events: auto; }

    .close-btn {
      position: absolute; top: 15px; right: 20px; z-index: 10;
      background: rgba(0,0,0,0.4); border: none; color: #fff;
      width: 30px; height: 30px; border-radius: 50%;
      font-size: 14px; cursor: pointer; transition: background 0.3s;
      display: flex; align-items: center; justify-content: center;
    }
    .close-btn:hover { background: rgba(0,0,0,0.7); color: var(--emerald); }

    .card-image-wrap {
      position: relative; width: 100%; height: 220px; overflow: hidden; cursor: pointer;
    }
    .card-image-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s; }
    .card-image-wrap:hover img { transform: scale(1.05); }
    .card-image-wrap::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 60px;
      background: linear-gradient(to bottom, transparent, rgba(15, 23, 42, 0.95));
    }
    .click-hint-badge {
      position: absolute; bottom: 15px; right: 15px; z-index: 2;
      font-size: 11px; color: #fff; background: rgba(44, 199, 165, 0.85);
      border-radius: 4px; padding: 4px 8px; font-weight: 500; letter-spacing: 1px;
    }

    .card-body { padding: 15px 24px 28px; }
    .card-city { font-family: 'Noto Serif SC', serif; font-size: 28px; font-weight: 400; color: #ffffff; line-height: 1.2; margin-bottom: 6px; }
    .card-date { font-family: 'Rajdhani', sans-serif; font-size: 11px; font-weight: 400; letter-spacing: 0.3em; color: var(--emerald); text-transform: uppercase; margin-bottom: 14px; }
    .card-divider { width: 40px; height: 2px; background: var(--emerald); margin-bottom: 14px; }
    .card-text { font-size: 14px; font-weight: 300; line-height: 1.85; color: #e2e8f0; text-align: justify;}

    /* 📍 精致的玻璃质感地标针（Pin）样式 */
    .custom-marker {
      width: 24px; height: 24px;
      background: rgba(44, 199, 165, 0.25); border: 2px solid var(--emerald);     
      border-radius: 50% 50% 50% 0; transform: rotate(-45deg); cursor: pointer;
      box-shadow: -2px 2px 6px rgba(0,0,0,0.4), 0 0 15px rgba(44, 199, 165, 0.4);
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex; align-items: center; justify-content: center;
    }
    .custom-marker::after {
      content: ''; width: 8px; height: 8px; background: #ffffff; border-radius: 50%; box-shadow: 0 0 6px #ffffff; transform: rotate(45deg); 
    }
    .custom-marker:hover {
      background: rgba(44, 199, 165, 0.45); border-color: #ffffff; 
      transform: rotate(-45deg) translate(3px, -3px) scale(1.2); 
      box-shadow: -5px 5px 12px rgba(0,0,0,0.5), 0 0 25px var(--emerald);
    }

    /* 城市多媒体相册子界面 */
    #gallery-overlay {
      position: fixed; inset: 0; z-index: 100;
      background: rgba(8, 14, 30, 0.85);
      backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
      display: flex; flex-direction: column; padding: 60px 40px;
      opacity: 0; pointer-events: none;
      transition: opacity 0.5s ease;
    }
    #gallery-overlay.active { opacity: 1; pointer-events: auto; }

    .gallery-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 40px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 20px; }
    .gallery-title { font-family: 'Noto Serif SC', serif; font-size: 32px; color: var(--emerald); font-weight: 400; }
    
    .back-map-btn {
      background: transparent; border: 1px solid var(--emerald); color: var(--emerald);
      padding: 10px 20px; border-radius: 30px; cursor: pointer; font-size: 14px;
      display: flex; align-items: center; gap: 8px; transition: all 0.3s;
    }
    .back-map-btn:hover { background: var(--emerald); color: #fff; box-shadow: 0 0 15px rgba(44, 199, 165, 0.4); }

    .media-grid {
      flex-grow: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px; overflow-y: auto; padding-right: 10px;
    }
    .media-item {
      position: relative; height: 200px; border-radius: 12px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.1); cursor: pointer; transition: transform 0.3s, box-shadow 0.3s;
    }
    .media-item:hover { transform: translateY(-4px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); }
    .media-item img, .media-item video { width: 100%; height: 100%; object-fit: cover; }
    
    .video-badge { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.2); font-size: 36px; color: #fff; transition: background 0.3s; }
    .media-item:hover .video-badge { background: rgba(0,0,0,0.4); color: var(--emerald); }

    /* 多媒体进一步放大预览灯箱 */
    #lightbox {
      position: fixed; inset: 0; z-index: 200; background: rgba(0, 0, 0, 0.95);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
    }
    #lightbox.active { opacity: 1; pointer-events: auto; }
    #lightbox-content { max-width: 90%; max-height: 85%; border-radius: 8px; box-shadow: 0 0 30px rgba(0,0,0,0.8); }
    .lightbox-close { position: absolute; top: 30px; right: 40px; color: #fff; font-size: 36px; cursor: pointer; transition: color 0.3s; }
    .lightbox-close:hover { color: var(--emerald); }

    /* 🟢 新增：右上角 BGM 静音/取消静音 小喇叭按钮 */
    #bgm-toggle-btn {
      position: fixed; top: 30px; right: 30px; z-index: 300;
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--card-bg);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      color: #ffffff; font-size: 16px; cursor: pointer;
      display: none; align-items: center; justify-content: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
      transition: opacity 0.6s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s, color 0.3s;
      opacity: 0;
    }
    #bgm-toggle-btn.visible { display: flex; opacity: 1; }
    #bgm-toggle-btn:hover {
      border-color: var(--emerald); color: var(--emerald);
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(44, 199, 165, 0.25);
    }
    #bgm-toggle-btn.muted { color: var(--text-muted); }
    @media (max-width: 680px) {
      #bgm-toggle-btn { top: 15px; right: 15px; width: 42px; height: 42px; font-size: 14px; }
    }
    /* 🟢 复制以下内容，直接追加到 <style> 标签里的合适位置 */
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
      color: rgba(255, 255, 255, 0.6); width: 60px; height: 60px; border-radius: 50%;
      font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.3s ease; z-index: 220;
    }
    .nav-arrow:hover {
      background: rgba(44, 199, 165, 0.25); border-color: var(--emerald); color: var(--emerald);
      box-shadow: 0 0 15px rgba(44, 199, 165, 0.3);
    }
    .arrow-left { left: 40px; }
    .arrow-right { right: 40px; }

    @media (max-width: 680px) {
      .nav-arrow { width: 45px; height: 45px; font-size: 16px; }
      .arrow-left { left: 15px; }
      .arrow-right { right: 15px; }
    }

    /* 加载动画 */
    #loading-screen {
      position: fixed; inset: 0; z-index: 999; background: var(--ink);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 20px; transition: opacity 1s ease;
    }
    #loading-screen.fade-out { opacity: 0; pointer-events: none; }
    .loading-title { font-family: 'Noto Serif SC', serif; font-size: 24px; font-weight: 300; color: #fff; letter-spacing: 0.15em; }
    .loading-ring { width: 48px; height: 48px; border: 2px solid rgba(255,255,255,0.1); border-top-color: var(--emerald); border-radius: 50%; animation: spin 1.4s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 680px) {
      #header-container { top: 15px; left: 15px; }
      #story-card { right: 16px; left: 16px; width: auto; top: auto; bottom: 40px; transform: translateY(40px); }
      #story-card.active { transform: translateY(0); }
      .media-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>

  <!-- 🟢 隐藏的 BGM 和音效音频标签 -->
  <audio id="audio-launch">
  <source src="https://raw.githubusercontent.com/CynthiaAnnX222/qqHBD/main/sound/launch.mp3" type="audio/mpeg">
  <source src="https://raw.githubusercontent.com/CynthiaAnnX222/qqHBD/main/sound/launch.m4a" type="audio/mp4">
  </audio>

  <div id="loading-screen">
    <div class="loading-ring"></div>
    <div class="loading-title">飞朱环游记</div>
  </div>

  <div id="map"></div>

  <!-- 🟢 新增：右上角 BGM 静音/取消静音 小喇叭按钮（启航后才显示） -->
  <button id="bgm-toggle-btn" onclick="toggleBgmMute()" title="静音 / 取消静音" aria-label="静音切换">
    <i class="fa-solid fa-volume-high"></i>
  </button>

  <!-- 左上角整合面板 -->
  <div id="header-container">
    <header class="header-panel">
      <span class="main-title">飞朱环游记</span>
      <span class="subtitle">with lidar mini version </span>
    </header>
    
    <!-- 🟢 新增的“返回地球全景”重置按钮 -->
    <button class="reset-view-btn" onclick="resetToGlobeView()">
      <i class="fa-solid fa-earth-asia"></i>
      <span>返回地球全景</span>
    </button>
  </div>

  <!-- 右侧故事卡片 -->
  <div id="story-card">
    <button class="close-btn" onclick="closeCard()"><i class="fa-solid fa-xmark"></i></button>
    <div class="card-image-wrap" id="card-main-pic">
      <span class="click-hint-badge"><i class="fa-solid fa-images"></i> 点击看相册</span>
      <img id="card-img" src="" alt="Memory" />
    </div>
    <div class="card-body">
      <div class="card-city" id="card-city">城市名称</div>
      <div class="card-date" id="card-date">旅行日期</div>
      <div class="card-divider"></div>
      <div class="card-text" id="card-text">故事文本</div>
    </div>
  </div>

  <!-- 城市多媒体相册子界面 -->
  <div id="gallery-overlay">
    <div class="gallery-header">
      <div class="gallery-title" id="gallery-city-name">城市足迹相册</div>
      
      <button class="back-map-btn" onclick="closeGallery()">
        <i class="fa-solid fa-earth-asia"></i> 返回地图
      </button>
    </div>
    <div class="media-grid" id="gallery-media-grid"></div>
  </div>

  <!-- 多媒体全屏放大灯箱 -->
  <div id="lightbox">
    <span class="lightbox-close" onclick="closeLightbox()">&times;</span>
    
    <button class="nav-arrow arrow-left" onclick="navigateMedia(-1)"><i class="fa-solid fa-chevron-left"></i></button>
    <button class="nav-arrow arrow-right" onclick="navigateMedia(1)"><i class="fa-solid fa-chevron-right"></i></button>
    
    <div id="lightbox-target-box" style="width:100%; height:100%; display:flex; align-items:center; justify-content:center;"></div>
  </div>

  ];

  // 🟢 修改点 1：完全根据截图 image_8a85e6.png 调整的初始全景参数（镜头正、缩放低）
  const GLOBE_INITIAL_VIEW = {

  let activeMemoryData = null; 
  let currentMediaIndex = 0; // 🟢 复制这一行：记录当前点开的是该城市的第几个照片/视频
  // 🟢 声音核心控制变量
  const launchSfx = document.getElementById('audio-launch');
  // 🟢 用纯内存对象声明地球音乐，彻底隐形，免疫一切克隆 bug
  const globeBgm = new Audio("https://raw.githubusercontent.com/CynthiaAnnX222/qqHBD/main/sound/globe.mp3");
  globeBgm.loop = true; // 开启循环播放
  let globeBgmMuted = false; // 用户是否手动关闭了地球音乐

  let cityBgm = null;         // 当前城市的 BGM 音频对象
  let cityBgmMuted = false;

    // 🟢 新增：BGM 淡入淡出 + 全局静音 控制
    const BGM_FADE_MS = 1500;       // 淡入淡出时长 1.5 秒
    const GLOBE_BGM_VOLUME = 0.5;   // 地球 BGM 的标准音量
    const CITY_BGM_VOLUME = 1.0;    // 城市 BGM 的标准音量

    // 逐步把音频音量降到 0，然后暂停（除非中途被其它淡入打断）
    function fadeOutAudio(audio, duration = BGM_FADE_MS) {
      if (!audio) return;
      if (audio._fadeTimer) clearInterval(audio._fadeTimer);
      const startVol = audio.volume;
      if (audio.paused || startVol === 0) { audio.pause(); return; }
      const steps = 30;
      const stepTime = duration / steps;
      let i = 0;
      audio._fadeTimer = setInterval(() => {
        i++;
        const v = startVol * (1 - i / steps);
        audio.volume = Math.max(0, v);
        if (i >= steps) {
          clearInterval(audio._fadeTimer);
          audio._fadeTimer = null;
          audio.pause();
        }
      }, stepTime);
    }

    // 从 0 逐步把音频音量升到目标值（会先确保在播放）
    function fadeInAudio(audio, targetVol, duration = BGM_FADE_MS) {
      if (!audio) return;
      if (audio._fadeTimer) clearInterval(audio._fadeTimer);
      audio.volume = 0;
      audio.play().catch(err => console.log("淡入播放受阻:", err));
      const steps = 30;
      const stepTime = duration / steps;
      let i = 0;
      audio._fadeTimer = setInterval(() => {
        i++;
        const v = targetVol * (i / steps);
        audio.volume = Math.min(targetVol, v);
        if (i >= steps) {
          clearInterval(audio._fadeTimer);
          audio._fadeTimer = null;
          audio.volume = targetVol;
        }
      }, stepTime);
    }

    // 🟢 新增：从「当前音量」平滑过渡到任意目标音量（可升可降，不会先跳到 0）
    // 用于视频压低/恢复 BGM，避免突然减小
    function fadeAudioTo(audio, targetVol, duration = BGM_FADE_MS) {
      if (!audio) return;
      if (audio._fadeTimer) clearInterval(audio._fadeTimer);
      // 确保在播放，否则音量调了也听不到
      if (audio.paused) {
        audio.play().catch(err => console.log("平滑过渡播放受阻:", err));
      }
      const startVol = audio.volume;
      const delta = targetVol - startVol;
      // 已经到位就不折腾
      if (Math.abs(delta) < 0.01) { audio.volume = targetVol; return; }
      const steps = 30;
      const stepTime = duration / steps;
      let i = 0;
      audio._fadeTimer = setInterval(() => {
        i++;
        audio.volume = Math.max(0, Math.min(1, startVol + delta * (i / steps)));
        if (i >= steps) {
          clearInterval(audio._fadeTimer);
          audio._fadeTimer = null;
          audio.volume = targetVol;
        }
      }, stepTime);
    }

    // 显示右上角小喇叭按钮（启航后调用）
    function showBgmToggleBtn() {
      const btn = document.getElementById('bgm-toggle-btn');
      if (btn) btn.classList.add('visible');
    }

    // 根据当前正在播放的是城市还是地球 BGM，刷新喇叭图标的样式
    function refreshBgmToggleIcon() {
      const btn = document.getElementById('bgm-toggle-btn');
      if (!btn) return;
      const isMuted = cityBgm ? cityBgmMuted : globeBgmMuted;
      const icon = btn.querySelector('i');
      if (isMuted) {
        btn.classList.add('muted');
        if (icon) icon.className = 'fa-solid fa-volume-xmark';
      } else {
        btn.classList.remove('muted');
        if (icon) icon.className = 'fa-solid fa-volume-high';
      }
    }

    // 点击小喇叭：静音 / 取消静音「当前正在播放的那条 BGM」
    function toggleBgmMute() {
      if (cityBgm) {
        cityBgmMuted = !cityBgmMuted;
        if (cityBgmMuted) {
          fadeOutAudio(cityBgm);
        } else {
          fadeInAudio(cityBgm, CITY_BGM_VOLUME);
        }
      } else {
        globeBgmMuted = !globeBgmMuted;
        if (globeBgmMuted) {
          fadeOutAudio(globeBgm);
        } else {
          fadeInAudio(globeBgm, GLOBE_BGM_VOLUME);
        }
      }
      refreshBgmToggleIcon();
    }

    // 🟢 新增：视频播放时把 BGM "压低垫底"到正常音量的 30%（视频有声音时薄薄垫在底下）
    const BGM_DUCK_RATIO = 0.2; // 压低到正常音量的 20%

    // 取得「当前生效的 BGM」以及它的「正常音量」
    function getActiveBgmInfo() {
      if (cityBgm) {
        return { audio: cityBgm, normalVol: CITY_BGM_VOLUME, muted: cityBgmMuted };
      }
      return { audio: globeBgm, normalVol: GLOBE_BGM_VOLUME, muted: globeBgmMuted };
    }

    // 视频开始播放：把当前 BGM 平滑压低到 30% 垫底（已静音则保持静音）
    function duckBgm() {
      const info = getActiveBgmInfo();
      if (!info.audio || info.muted) return;
      const target = info.normalVol * BGM_DUCK_RATIO;
      // 幂等保护：如果已经压低到目标音量（且没有正在淡变），就不重复处理
      if (!info.audio._fadeTimer && Math.abs(info.audio.volume - target) < 0.01) return;
      // 🟢 从当前音量平滑下降到 20%（不再突然减小）
      fadeAudioTo(info.audio, target);
    }

    // 视频结束 / 关闭灯箱：把当前 BGM 平滑恢复到正常音量（已静音则保持静音）
    function unduckBgm() {
      const info = getActiveBgmInfo();
      if (!info.audio || info.muted) return;
      // 幂等保护：如果音量已经是正常值（且没有正在淡变），就直接返回
      if (!info.audio._fadeTimer && Math.abs(info.audio.volume - info.normalVol) < 0.01) return;
      // 🟢 从当前（被压低的）音量平滑回升到正常音量
      fadeAudioTo(info.audio, info.normalVol);
    }   // 用户是否在城市相册界面手动暂停了城市 BGM

      loader.addEventListener('click', () => {

        // 2. 动态缓冲：自动开启初始地球 BGM（音量调小作为背景衬托）
        globeBgm.volume = 0.5;

        // 3. 极客彩蛋运镜：在黑幕还没完全消失时，让地球在幕后悄悄开始自转平移，造成飞船正在推进的视觉缓冲
        if (typeof map !== 'undefined') {

        // 4. 电影级淡出：将原先 1 秒的突兀转场，拉长到 2.5 秒（2500ms）的深空渐变
        loader.style.transition = "opacity 5s cubic-bezier(0.25, 1, 0.5, 1)"; // 使用缓动曲线，前快后慢
        loader.classList.add('fade-out');

        // 5. 缓冲结束后彻底移除遮罩
        setTimeout(() => {
          loader.remove();
        }, 5000); // 配合 2.5 秒的漫长高质感转场
      });
     } // 👈 补上这个结束 if 的大括号
    }, 800);

    drawExploreMarkers();

  function openCard(data) {
    activeMemoryData = data; 
    const card = document.getElementById('story-card');
    card.classList.remove('active');

    setTimeout(() => {
      document.getElementById('card-city').textContent  = data.title;
      document.getElementById('card-date').textContent  = data.date;
      document.getElementById('card-img').src           = data.image;
      document.getElementById('card-text').textContent  = data.text;
      card.classList.add('active');
    }, 200);
  }

  function closeCard() { document.getElementById('story-card').classList.remove('active'); }
  map.on('click', () => { closeCard(); });

  // 🟢 修改点 2：新增一键飞回大地球初始视角的函数
  function resetToGlobeView() {
    closeCard(); // 自动把当前可能开着的城市卡片关掉，还给界面清爽
    
    map.flyTo({
      center: GLOBE_INITIAL_VIEW.center,
      zoom: GLOBE_INITIAL_VIEW.zoom,
      pitch: GLOBE_INITIAL_VIEW.pitch,
      bearing: GLOBE_INITIAL_VIEW.bearing,
      speed: 0.7,        // 飞回大地球的速度，略微轻快
      curve: 1.5,        // 镜头拉高的完美反向弧度
      essential: true
    });
  }

  // 相册控制逻辑
  document.getElementById('card-main-pic').addEventListener('click', () => {
    if (!activeMemoryData) return;
    const overlay = document.getElementById('gallery-overlay');
    const grid = document.getElementById('gallery-media-grid');
    document.getElementById('gallery-city-name').textContent = `📍 ${activeMemoryData.title} · 飞朱足迹`;
    grid.innerHTML = ""; 

    activeMemoryData.media.forEach((item, index) => {
      const wrapper = document.createElement('div');
      wrapper.className = "media-item";
      if (item.type === "image") {
        wrapper.innerHTML = `<img src="${item.url}" alt="photo" />`;
        wrapper.addEventListener('click', () => { currentMediaIndex = index; zoomMedia('image', item.url); });
      } else if (item.type === "video") {
        wrapper.innerHTML = `<video src="${item.url}" muted loop playsinline></video><div class="video-badge"><i class="fa-solid fa-circle-play"></i></div>`;
        wrapper.addEventListener('mouseenter', () => wrapper.querySelector('video').play());
        wrapper.addEventListener('mouseleave', () => { const v = wrapper.querySelector('video'); v.pause(); v.currentTime = 0; });
        wrapper.addEventListener('click', () => { currentMediaIndex = index; zoomMedia('video', item.url); });
      }
      grid.appendChild(wrapper);
    });
    // 🟢 进入城市相册：地球 BGM 淡出，城市 BGM 淡入（不再突兀切换）
    // 地球 BGM 淡出
    fadeOutAudio(globeBgm);

    // 停掉上一个城市的 BGM（如果有）
    if (cityBgm) {
      fadeOutAudio(cityBgm);
    }

    // 播放当前城市的 BGM（淡入）
    if (activeMemoryData.bgm) {
      cityBgm = new Audio(activeMemoryData.bgm);
      cityBgm.loop = true;
      cityBgmMuted = false;
      // 如果用户没有手动静音，则淡入；否则保持静音状态
      if (!cityBgmMuted) {
        fadeInAudio(cityBgm, CITY_BGM_VOLUME);
      }
    }
    refreshBgmToggleIcon();

    overlay.classList.add('active');
  });

  function closeGallery() {
      document.getElementById('gallery-overlay').classList.remove('active');

      // 🟢 离开相册回到地图：城市 BGM 淡出后释放，地球 BGM 淡入
      const leavingCityBgm = cityBgm;
      cityBgm = null;
      if (leavingCityBgm) {
        fadeOutAudio(leavingCityBgm);
        // 淡出结束后再彻底释放，避免打断淡出过程
        setTimeout(() => {
          leavingCityBgm.pause();
          leavingCityBgm.currentTime = 0;
        }, BGM_FADE_MS + 50);
      }

      // 恢复地球 BGM（如果用户没有手动关掉它的话），用淡入
      if (!globeBgmMuted) {
        fadeInAudio(globeBgm, GLOBE_BGM_VOLUME);
      }
      refreshBgmToggleIcon();
    }

  // ✨ 优化后的代码：确保 100% 激活声音
  function zoomMedia(type, url) {
    const lightbox = document.getElementById('lightbox');
    const targetBox = document.getElementById('lightbox-target-box');
    targetBox.innerHTML = "";
    
    if (type === 'image') { 
      targetBox.innerHTML = `<img id="lightbox-content" src="${url}" alt="Zoomed" />`; 
    }
    else if (type === 'video') { 
      // 1. 显式地将 volume 设为 1.0 (最大音量)，且坚决不加 muted 属性
      targetBox.innerHTML = `<video id="lightbox-content" src="${url}" controls autoplay style="width:100%; height:100%;"></video>`; 
      
      // 2. 用 JS 代码在视频加载完毕后，强行给它解除静音并调高音量
      const videoElement = document.getElementById('lightbox-content');
      if (videoElement) {
        videoElement.muted = false; // 强行关闭静音
        videoElement.volume = 1.0;  // 声音开到最大
        
        // 🟢 视频有声音时，不再暂停 BGM，而是把它压低到 30% 薄薄垫在底下
        duckBgm();
        
        // 3. 兜底策略：如果因为浏览器拦截导致播放失败，自动转为尝试带声音播放
        videoElement.play().catch(error => {
          console.log("浏览器拦截了带声音的自动播放，好朋友需要手动点一下视频上的播放或小喇叭按钮哦：", error);
        });
        // 视频播放结束后，恢复 BGM
        videoElement.addEventListener('ended', () => {
          // 🟢 视频结束：把被压低的 BGM 平滑恢复到正常音量
          unduckBgm();
        });
      }
    }
    lightbox.classList.add('active');
  }

  function closeLightbox() {
      const lightbox = document.getElementById('lightbox');
      const video = lightbox.querySelector('video');
      if (video) video.pause();
      lightbox.classList.remove('active');
      // 🟢 关闭灯箱（可能是关掉正在播放的视频）：把被压低的 BGM 平滑恢复到正常音量
      unduckBgm();
    }
  // 🟢 复制以下两个函数，追加到 script 里的末尾区域

  // 1. 核心翻页计算逻辑
  // 🟢 完美修正：切换大图时，智能判定并自动恢复城市/地球 BGM
  function navigateMedia(direction) {
      if (!activeMemoryData || !activeMemoryData.media) return;

      const totalMedia = activeMemoryData.media.length;

      // 🟢 先记下「正在离开的这一张」是不是视频
      const prevMedia = activeMemoryData.media[currentMediaIndex];
      const leavingVideo = prevMedia && prevMedia.type === 'video';

      // 计算下一个需要播放的媒体索引
      currentMediaIndex = (currentMediaIndex + direction + totalMedia) % totalMedia;

      const nextMedia = activeMemoryData.media[currentMediaIndex];

      // 🟢 只有「从视频离开、且下一张不是视频」时，才把被压低的 BGM 恢复到正常音量。
      // 图片之间互相翻页完全不碰音量；下一张还是视频则交给 zoomMedia 里的 duckBgm 继续保持 30%。
      if (leavingVideo && nextMedia.type !== 'video') {
        unduckBgm();
      }

      // 调用原有的放大灯箱渲染函数，加载上/下一张
      zoomMedia(nextMedia.type, nextMedia.url);
    }

  // 2. 键盘左右方向键监听扩展（支持键盘盲操左右翻页，非常炫酷）
  document.addEventListener('keydown', (e) => {
    const lightbox = document.getElementById('lightbox');
    if (lightbox.classList.contains('active')) {
      if (e.key === 'ArrowRight') navigateMedia(1);
      if (e.key === 'ArrowLeft') navigateMedia(-1);
      if (e.key === 'Escape') closeLightbox();
    }
  });
  // 🟢 复制以下内容，直接粘贴在 </script> 的上方即可
  // 🟢 复制以下内容，完全覆盖最末尾的按钮点击事件
  
  </script>
</body>
